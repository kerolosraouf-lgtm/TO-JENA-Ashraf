<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0812">
<title>Jena 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* ====== عدّل النصوص والتاريخ من هنا (في قسم السكربت تحت) ====== */
:root{--night:#0d0812;--plum:#2a1030;--rose:#ff5fa2;--blush:#ffd6e6;--gold:#e0b27a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--night);color:var(--blush);font-family:"Aref Ruqaa","Geeza Pro","Segoe UI",serif;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-text-size-adjust:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;transition:opacity 1s}
.hide{opacity:0;pointer-events:none}
#gate{z-index:5;background:var(--night);padding:24px}
#gate h1{font-size:2rem;color:var(--rose);font-weight:700}
#gate p{color:var(--gold);font-size:1.1rem}
input{width:min(78vw,300px);padding:14px;border-radius:14px;border:1px solid var(--gold);background:transparent;color:#fff;font:inherit;font-size:1.2rem;text-align:center}
input:focus{outline:2px solid var(--rose)}
button{font:inherit;font-size:1.2rem;padding:13px 30px;border-radius:30px;border:0;background:var(--rose);color:#2a0a1a;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold)}
#err{min-height:1.4em;color:#ff9db8;font-size:1rem}
#intro{z-index:3;background:var(--night)}
#c{position:absolute;inset:0;width:100%;height:100%}
#go,#next{position:absolute;bottom:calc(11vh + env(safe-area-inset-bottom,0));z-index:2;transition:opacity .8s}
#next{background:transparent;border:1px solid var(--gold);color:var(--gold)}
#heartText{position:absolute;z-index:2;left:0;right:0;top:46%;transform:translateY(-50%);font-size:clamp(1.5rem,8vw,2.6rem);color:#fff;opacity:0;transition:opacity 1.6s;text-shadow:0 0 18px var(--rose)}
#heartText small{display:block;font-size:.5em;color:var(--gold);margin-top:6px}
main{max-width:560px;margin:0 auto;padding:56px 22px 90px;display:flex;flex-direction:column;gap:64px;text-align:center}
.rv{opacity:0;transform:translateY(22px);transition:opacity 1.1s,transform 1.1s}
.rv.on{opacity:1;transform:none}
h2{font-size:1.9rem;color:var(--rose);margin-bottom:18px}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cnt div{background:var(--plum);border:1px solid #5a2a52;border-radius:14px;padding:14px 2px}
.cnt b{display:block;font-size:1.6rem;color:#fff;font-variant-numeric:tabular-nums}
.cnt span{font-size:.85rem;color:var(--gold)}
#days{margin-top:14px;color:var(--gold);font-size:1.1rem}
.photo{width:100%;border-radius:150px 150px 24px 24px;display:block;box-shadow:0 0 60px rgba(255,95,162,.35)}
.ar{font-size:1.45rem;line-height:2}
.en{direction:ltr;font-family:"Cormorant Garamond","Georgia",serif;font-style:italic;font-size:1.3rem;line-height:1.75;display:flex;flex-direction:column;gap:28px;text-align:left}
.hard{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:28px 6px;font-size:1.5rem;line-height:2;color:#fff}
.end{font-size:2rem;color:var(--rose)}
.end small{display:block;margin-top:10px;font-size:1.1rem;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.rv{transition:none}}
</style>
</head>
<body>

<div id="gate" class="screen">
  <h1>جينا 💗</h1>
  <p>فيه مفاجأة مستنياكي... اكتبي كلمة السر</p>
  <input id="pw" type="text" autocomplete="off" autocapitalize="off" placeholder="كلمة السر" enterkeyhint="go">
  <div id="err"></div>
  <button id="open">افتحي</button>
</div>

<div id="intro" class="screen hide">
  <canvas id="c"></canvas>
  <div id="heartText"></div>
  <button id="go">اضغطي 💗</button>
  <button id="next" style="opacity:0;pointer-events:none">كمّلي ↓</button>
</div>

<main id="main" hidden>
  <section class="rv">

    </div>

<script>
/* ============ الإعدادات: عدّل أي حاجة هنا ============ */
const PASSWORD   = "بحبك";
const START      = new Date(2026, 2, 2, 0, 0, 0);   // 2 مارس 2026 (الشهر 2 = مارس). عدّله لو التاريخ مختلف
const NAME       = "Jena";                           // الكلمة اللي بتتكتب من النقط
const HEART_TEXT = "7 شهور و يوم";
const NOTE_AR    = "جينا، النهارده 7 شهور ويوم... وأنا لسه فرحان إنك في حياتي.";
const HARD_AR    = "عدّينا أوقات صعبة، وزعلنا من بعض كتير... ومع كل ده أنا لسه هنا، ولسه بختارك.";
const LETTER_EN  = [
  "You're more special to me than you'll ever be able to understand, my love. Sometimes I try to find the perfect words to explain what you mean to me, but somehow every word still feels too small. You've become such a beautiful and important part of my life that I honestly can't imagine my days feeling the same without you.",
  "You're not just someone who's in my life, you've become someone who's deeply connected to my heart. Before you, I never imagined that one person could become this important to me. Somehow, you slowly became a part of everything.",
  "You're the first person I want to tell when something makes me happy, the person I think about when I'm having a difficult day, and the person my heart naturally searches for without me even realizing it. I hope you always remember how much you matter to me, especially on the days when you don't feel like you're enough. You are appreciated in ways you probably don't even notice.",
  "I love your heart, your personality, your kindness, your way of thinking, and all those tiny details that make you who you are. Even the things you may see as flaws are things I would never want to change about you.",
  "Your happiness will always mean something to me. I find myself thinking about whether you're okay, whether you've eaten, whether you're tired, or whether something is bothering you. Not because I'm obligated to care, but because caring about you has become something that comes naturally to me. When someone becomes this important to your heart, you start caring about the smallest things without even thinking about it.",
  "Thank you for every moment you've shared with me, every smile, every laugh, every conversation, and every memory we made together. Whether you realize it or not, you've brought so much happiness into my life and changed me in ways I'll always be grateful for. You've shown me how beautiful it can be to genuinely care about someone and love them with your whole heart.",
  "If there's one thing I want you to always remember, it's this: you'll never be “just another person” to me. You'll always be someone special, someone I could never replace. No matter where life takes us, you'll always have a place in my heart that belongs only to you.",
  "Because the truth is, you're not simply important to me. You're someone I genuinely cherish, someone whose happiness matters to me, and someone I'll always be thankful for. I love you more than I could ever explain through words, and I hope you never forget how deeply you are loved, valued, and cherished by me.",
  "Happy 7 months and 1 day, Jena."
];
const END_AR     = "بحبك يا جينا 💗";
const END_SMALL  = "وكل يوم معاكي أحلى من اللي قبله";
/* ====================================================== */

const $ = id => document.getElementById(id);
const norm = s => s.replace(/[\u064B-\u065F\s]/g, "").toLowerCase();

// تعبئة النصوص
$("heartText").innerHTML = HEART_TEXT + "<small>♥</small>";
$("note1").textContent = NOTE_AR;
$("hard").textContent = HARD_AR;
$("end").innerHTML = END_AR + "<small>" + END_SMALL + "</small>";
$("letter").innerHTML = LETTER_EN.map(t => "<p class=\"rv\">" + t + "</p>").join("");

// كلمة السر
function tryOpen(){
  if (norm($("pw").value) === norm(PASSWORD)){
    $("gate").classList.add("hide");
    $("intro").classList.remove("hide");
    startRain();
  } else {
    $("err").textContent = "مش دي... جرّبي تاني 💗";
  }
}
$("open").onclick = tryOpen;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryOpen(); });

// الكانفس
const cv = $("c"), ctx = cv.getContext("2d");
let W, H, DPR, cols = [], parts = [], phase = "rain", running = false;
const N = 750;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cols = Array.from({length: Math.ceil(W / 16)}, () => Math.random() * H);
}
addEventListener("resize", resize);

function rain(alpha){
  ctx.fillStyle = "rgba(13,8,18," + alpha + ")";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,95,162,.75)";
  cols.forEach((y, i) => {
    if (Math.random() < .5) ctx.fillRect(i * 16 + 6, y, 2.5, 2.5);
    cols[i] = y > H + 20 && Math.random() > .97 ? 0 : y + 4 + (i % 5);
  });
}

function textTargets(){
  const o = document.createElement("canvas"); o.width = W; o.height = H;
  const x = o.getContext("2d");
  const fs = Math.min(W * 0.4, 220);
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = "italic 700 " + fs + "px Georgia, serif";
  x.fillText(NAME, W / 2, H * 0.44);
  const d = x.getImageData(0, 0, W, H).data, pts = [], step = 4;
  for (let yy = 0; yy < H; yy += step) for (let xx = 0; xx < W; xx += step)
    if (d[(yy * W + xx) * 4 + 3] > 128) pts.push([xx, yy]);
  return fit(pts);
}
function heartTargets(){
  const k = Math.min(W * 0.024, H * 0.021), cx = W / 2, cy = H * 0.46, lv = [1, .86, .72, .58, .46], pts = [];
  for (let i = 0; i < N; i++){
    const t = Math.random() * 6.2832, s = lv[i % lv.length];
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push([cx + hx * k * s, cy - hy * k * s]);
  }
  return pts;
}
function fit(pts){
  for (let i = pts.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
  if (!pts.length) return Array.from({length: N}, () => [W / 2, H / 2]);
  return Array.from({length: N}, (_, i) => pts[i % pts.length]);
}
function setTargets(tg){ parts.forEach((p, i) => { p.tx = tg[i][0]; p.ty = tg[i][1]; }); }

function frame(){
  if (phase === "rain") rain(.16);
  else {
    rain(.28);
    parts.forEach(p => {
      p.x += (p.tx - p.x) * .075 + (Math.random() - .5) * .6;
      p.y += (p.ty - p.y) * .075 + (Math.random() - .5) * .6;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    });
  }
  requestAnimationFrame(frame);
}
function startRain(){
  resize();
  if (!running){ running = true; frame(); }
}

$("go").onclick = () => {
  $("go").style.opacity = 0; $("go").style.pointerEvents = "none";
  const colors = ["#ff5fa2", "#ffd6e6", "#ff8fc0", "#fff"];
  parts = Array.from({length: N}, (_, i) => ({
    x: Math.random() * W, y: Math.random() * H, tx: W / 2, ty: H / 2,
    r: 1.4 + Math.random() * 1.6, c: colors[i % colors.length]
  }));
  phase = "morph";
  setTargets(textTargets());
  setTimeout(() => setTargets(heartTargets()), 3200);
  setTimeout(() => { $("heartText").style.opacity = 1; }, 5200);
  setTimeout(() => { $("next").style.opacity = 1; $("next").style.pointerEvents = "auto"; }, 6800);
};

// الدخول للموقع
$("next").onclick = () => {
  $("intro").classList.add("hide");
  $("main").hidden = false;
  scrollTo(0, 0);
  document.body.style.height = "auto";
  document.documentElement.style.height = "auto";
  setTimeout(() => { phase = "rain"; }, 1000);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); } }), {threshold: .2});
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
  tick(); setInterval(tick, 1000);
};

// العدّاد
function tick(){
  const n = new Date();
  let m = (n.getFullYear() - START.getFullYear()) * 12 + n.getMonth() - START.getMonth();
  let a = new Date(START.getFullYear(), START.getMonth() + m, START.getDate(), 0, 0, 0);
  if (a > n){ m--; a = new Date(START.getFullYear(), START.getMonth() + m, START.getDate(), 0, 0, 0); }
  let r = Math.floor((n - a) / 1000);
  $("m").textContent = m;
  $("d").textContent = Math.floor(r / 86400); r %= 86400;
  $("h").textContent = Math.floor(r / 3600); r %= 3600;
  $("mi").textContent = Math.floor(r / 60);
  $("s").textContent = r % 60;
  $("days").textContent = "يعني " + Math.floor((n - START) / 86400000) + " يوم من الحب 💗";
}
</script>
